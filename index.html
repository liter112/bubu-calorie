<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#58cc02">
<meta name="description" content="卜卜卡路里：多邻国式营养打卡。按《中国食物成分表》计算食材在烹饪后的营养，对照 19 岁减脂女性的每日目标给出建议。">
<title>卜卜卡路里 · 多邻国式营养打卡</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A5%95%3C/text%3E%3C/svg%3E">
<style>
/* ---- base.css ---- */
/* ===== 卜卜卡路里 · 设计令牌与基础布局 ===== */
:root {
  --green: #58cc02;
  --green-dark: #58a700;
  --green-soft: #d7ffb8;
  --green-tint: #f0ffe0;
  --blue: #1cb0f6;
  --blue-dark: #1899d6;
  --blue-soft: #ddf4ff;
  --purple: #ce82ff;
  --purple-soft: #f3e6ff;
  --orange: #ff9600;
  --orange-soft: #fff3dc;
  --red: #ff4b4b;
  --red-soft: #ffe4e4;
  --yellow: #ffc800;
  --text: #3c3c3c;
  --text-soft: #6f6f6f;
  --muted: #9b9b9b;
  --line: #e5e5e5;
  --line-strong: #d5d5d5;
  --bg: #ffffff;
  --bg-soft: #f7f7f7;
  --bg-card: #ffffff;
  --shadow: 0 2px 0 var(--line);
  --radius: 18px;
  --radius-sm: 12px;
  --radius-lg: 26px;
  --nav-h: 68px;
  --maxw: 980px;
  --font: "Nunito", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
    "Segoe UI", system-ui, -apple-system, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg-soft);
  color: var(--text);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

body { padding-bottom: calc(var(--nav-h) + 22px); }

h1, h2, h3, h4 { margin: 0; font-weight: 800; letter-spacing: .2px; }
h1 { font-size: 26px; }
h2 { font-size: 20px; }
h3 { font-size: 17px; }
p { margin: 0; }
button { font-family: inherit; }
a { color: var(--blue-dark); }

.app {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 0 16px;
}

/* ---------- 顶部栏 ---------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  background: rgba(255, 255, 255, .94);
  backdrop-filter: blur(8px);
  border-bottom: 2px solid var(--line);
}
.topbar__inner {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 18px; }
.brand__mark { font-size: 22px; line-height: 1; }
.brand__name { letter-spacing: .5px; }
.topbar__spacer { flex: 1; }
.topbar__stat {
  display: flex;
  align-items: center;
  gap: 5px;
  font-weight: 800;
  font-size: 15px;
  padding: 5px 11px;
  border-radius: 999px;
  background: var(--bg-soft);
  border: 2px solid var(--line);
  white-space: nowrap;
}
.topbar__stat--fire { color: var(--orange); background: var(--orange-soft); border-color: #ffe0b2; }
.topbar__stat--xp { color: var(--blue-dark); background: var(--blue-soft); border-color: #b9e6ff; }

/* ---------- 视图与分区 ---------- */
.view { padding: 18px 0 8px; animation: viewIn .28s ease; }
@keyframes viewIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.section { margin-bottom: 18px; }
.section__head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  margin: 0 2px 10px;
}
.section__title { font-size: 17px; font-weight: 900; }
.section__hint { font-size: 12.5px; color: var(--muted); font-weight: 700; }

.grid { display: grid; gap: 12px; }
.grid--2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid--3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid--auto { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }

.row { display: flex; align-items: center; gap: 10px; }
.row--between { justify-content: space-between; }
.row--wrap { flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.spacer { flex: 1; }

.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.tiny { font-size: 11.5px; }
.bold { font-weight: 800; }
.center { text-align: center; }
.nowrap { white-space: nowrap; }

/* ---------- 底部导航 ---------- */
.tabbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 50;
  background: rgba(255, 255, 255, .97);
  border-top: 2px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
.tabbar__inner {
  max-width: var(--maxw);
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  height: var(--nav-h);
}
.tab {
  border: 0;
  background: transparent;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  font-size: 11.5px;
  font-weight: 800;
  color: var(--muted);
  cursor: pointer;
  padding: 6px 2px;
  transition: color .15s;
}
.tab__icon { font-size: 21px; line-height: 1; transition: transform .2s; }
.tab.is-active { color: var(--green-dark); }
.tab.is-active .tab__icon { transform: translateY(-1px) scale(1.08); }
.tab:hover { color: var(--text); }

@media (min-width: 860px) {
  .grid--2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  h1 { font-size: 30px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}

/* ---- components.css ---- */
/* ===== 组件 ===== */

/* ---------- 卡片 ---------- */
.card {
  background: var(--bg-card);
  border: 2px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
}
.card--flat { box-shadow: none; }
.card--hero {
  background: linear-gradient(135deg, #f4ffe9 0%, #ffffff 65%);
  border-color: #d9f2c0;
}
.card--pink { background: #fff5f8; border-color: #ffd8e4; }
.card--blue { background: #f2fbff; border-color: #c8ecff; }
.card--orange { background: #fffaf0; border-color: #ffe4b8; }
.card__title { font-size: 15px; font-weight: 900; margin-bottom: 8px; }
.card__sub { font-size: 12.5px; color: var(--muted); font-weight: 700; }

/* ---------- 按钮 ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  border: 0;
  border-radius: 14px;
  padding: 12px 18px;
  font-size: 15px;
  font-weight: 900;
  letter-spacing: .4px;
  color: #fff;
  background: var(--green);
  box-shadow: 0 4px 0 var(--green-dark);
  cursor: pointer;
  transition: transform .06s ease, box-shadow .06s ease, filter .15s;
  user-select: none;
  white-space: nowrap;
}
.btn:hover { filter: brightness(1.03); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--green-dark); }
.btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: 0 4px 0 var(--green-dark); transform: none; }
.btn--blue { background: var(--blue); box-shadow: 0 4px 0 var(--blue-dark); }
.btn--blue:active { box-shadow: 0 1px 0 var(--blue-dark); }
.btn--orange { background: var(--orange); box-shadow: 0 4px 0 #d97e00; }
.btn--orange:active { box-shadow: 0 1px 0 #d97e00; }
.btn--red { background: var(--red); box-shadow: 0 4px 0 #d83a3a; }
.btn--red:active { box-shadow: 0 1px 0 #d83a3a; }
.btn--ghost {
  background: #fff;
  color: var(--text-soft);
  border: 2px solid var(--line);
  box-shadow: 0 3px 0 var(--line);
}
.btn--ghost:active { box-shadow: 0 1px 0 var(--line); }
.btn--sm { padding: 8px 13px; font-size: 13px; border-radius: 11px; }
.btn--xs { padding: 5px 9px; font-size: 12px; border-radius: 9px; box-shadow: 0 2px 0 var(--green-dark); }
.btn--block { width: 100%; }
.btn--lg { padding: 16px 22px; font-size: 17px; border-radius: 16px; }
.btn--icon { width: 34px; height: 34px; padding: 0; border-radius: 10px; font-size: 15px; }

/* ---------- 进度环 ---------- */
.rings { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.ring { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
.ring__svg { width: 74px; height: 74px; transform: rotate(-90deg); }
.ring__track { fill: none; stroke: #eef0f2; stroke-width: 9; }
.ring__bar { fill: none; stroke: var(--green); stroke-width: 9; stroke-linecap: round; transition: stroke-dasharray .6s ease; }
.ring__pct {
  position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  width: 74px; height: 74px; display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 900; letter-spacing: -.2px;
}
.ring__label { font-size: 11.5px; font-weight: 800; color: var(--muted); margin-top: -2px; }
.ring--blue .ring__bar { stroke: var(--blue); }
.ring--orange .ring__bar { stroke: var(--orange); }
.ring--purple .ring__bar { stroke: var(--purple); }

/* ---------- 进度条 ---------- */
.bar {
  position: relative;
  height: 12px;
  background: #eef0f2;
  border-radius: 999px;
  overflow: hidden;
}
.bar__fill {
  position: absolute;
  inset: 0 auto 0 0;
  width: 0;
  border-radius: 999px;
  background: var(--green);
  transition: width .5s cubic-bezier(.22, .61, .36, 1);
}
.bar--blue .bar__fill { background: var(--blue); }
.bar--orange .bar__fill { background: var(--orange); }
.bar--red .bar__fill { background: var(--red); }
.bar--purple .bar__fill { background: var(--purple); }
.bar--thin { height: 8px; }
.bar-row { display: grid; grid-template-columns: 76px minmax(36px, 1fr) auto; align-items: center; gap: 10px; padding: 5px 0; }
.bar-row__name { font-size: 12.5px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-row__val { font-size: 11px; font-weight: 700; color: var(--muted); text-align: right; white-space: nowrap; }
.bar-row__val b { color: var(--text); font-size: 12px; }
@media (max-width: 420px) {
  .bar-row { grid-template-columns: 68px minmax(30px, 1fr) auto; gap: 8px; }
  .bar-row__name { font-size: 12px; }
}

/* ---------- 食物库列表行 ---------- */
.food-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 2px;
  border-bottom: 1px solid #f4f4f4;
  cursor: pointer;
}
.food-row:last-child { border-bottom: 0; }
.food-row:hover { background: #fbfdf7; }
.food-row__emoji { font-size: 19px; width: 26px; text-align: center; flex: none; }
.food-row__main { flex: 1; min-width: 0; }
.food-row__name {
  font-weight: 800; font-size: 13.5px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.food-row__meta { font-size: 11px; color: var(--muted); font-weight: 700; }
.food-row__nums { text-align: right; min-width: 52px; flex: none; }
.food-row__nums b { display: block; font-size: 13px; font-weight: 900; }
.food-row__nums span { font-size: 10px; color: var(--muted); font-weight: 700; }

/* ---------- 标签 / 徽章 ---------- */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 10px;
  border-radius: 999px;
  background: var(--bg-soft);
  border: 2px solid var(--line);
  font-size: 12px;
  font-weight: 800;
  color: var(--text-soft);
  white-space: nowrap;
}
.chip--green { background: var(--green-tint); border-color: #c8ee9e; color: var(--green-dark); }
.chip--blue { background: var(--blue-soft); border-color: #b9e6ff; color: var(--blue-dark); }
.chip--orange { background: var(--orange-soft); border-color: #ffe0b2; color: #b06a00; }
.chip--red { background: var(--red-soft); border-color: #ffc2c2; color: #d02f2f; }
.chip--purple { background: var(--purple-soft); border-color: #e6ccff; color: #8b3fd1; }
.chip--silent { background: #fafafa; border-color: #eee; color: #aaa; }
.chip--btn { cursor: pointer; }
.chip--btn.is-active { background: var(--green); border-color: var(--green-dark); color: #fff; }

.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  font-weight: 900;
  padding: 2px 7px;
  border-radius: 7px;
  background: var(--blue-soft);
  color: var(--blue-dark);
}
.badge--usda { background: var(--purple-soft); color: #8b3fd1; }
.badge--warn { background: var(--orange-soft); color: #b06a00; }

/* ---------- 搜索 ---------- */
.search {
  position: relative;
  display: flex;
  align-items: center;
  gap: 10px;
  background: #fff;
  border: 2px solid var(--line);
  border-radius: 16px;
  padding: 4px 14px;
  transition: border-color .15s, box-shadow .15s;
}
.search:focus-within { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(28, 176, 246, .12); }
.search__icon { font-size: 18px; opacity: .5; }
.search__input {
  flex: 1;
  border: 0;
  outline: 0;
  font-size: 16px;
  font-family: inherit;
  color: var(--text);
  background: transparent;
  padding: 10px 0;
  min-width: 0;
}
.search__clear { border: 0; background: none; font-size: 16px; color: var(--muted); cursor: pointer; padding: 4px; }

.suggest {
  position: relative;
  z-index: 20;
  margin-top: 8px;
  border: 2px solid var(--line);
  border-radius: 14px;
  background: #fff;
  overflow: hidden;
  max-height: 330px;
  overflow-y: auto;
}
.suggest__item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 14px;
  cursor: pointer;
  border-bottom: 1px solid #f1f1f1;
}
.suggest__item:last-child { border-bottom: 0; }
.suggest__item:hover, .suggest__item.is-focus { background: var(--green-tint); }
.suggest__name { font-weight: 800; font-size: 14.5px; }
.suggest__meta { font-size: 11.5px; color: var(--muted); font-weight: 700; }
.suggest__empty { padding: 18px 14px; text-align: center; color: var(--muted); font-size: 13px; }

/* ---------- 输入 ---------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.field__label { font-size: 12.5px; font-weight: 800; color: var(--text-soft); }
.input {
  width: 100%;
  border: 2px solid var(--line);
  border-radius: 13px;
  padding: 11px 13px;
  font-size: 16px;
  font-family: inherit;
  color: var(--text);
  outline: 0;
  background: #fff;
  transition: border-color .15s, box-shadow .15s;
}
.input:focus { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(28, 176, 246, .12); }
.input--err { border-color: var(--red); }
.input-group { display: flex; gap: 8px; align-items: stretch; }
.input-group .input { flex: 1; }
.unit { display: flex; align-items: center; padding: 0 12px; background: var(--bg-soft); border: 2px solid var(--line); border-radius: 13px; font-weight: 800; color: var(--muted); font-size: 14px; }
.err { color: var(--red); font-size: 12.5px; font-weight: 700; }

/* ---------- 烹饪方式卡片 ---------- */
.methods { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.method {
  position: relative;
  text-align: left;
  border: 2px solid var(--line);
  border-radius: 15px;
  background: #fff;
  padding: 11px 12px;
  cursor: pointer;
  transition: border-color .15s, background .15s, transform .1s;
  box-shadow: 0 2px 0 var(--line);
}
.method:hover { border-color: #c9e7a8; }
.method.is-active { border-color: var(--green); background: var(--green-tint); box-shadow: 0 2px 0 #b6e284; }
.method__top { display: flex; align-items: center; gap: 6px; font-weight: 900; font-size: 14px; }
.method__icon { font-size: 15px; }
.method__stats { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.method__stat {
  font-size: 11px;
  font-weight: 800;
  padding: 2px 6px;
  border-radius: 6px;
  background: rgba(0, 0, 0, .04);
  color: var(--text-soft);
}
.method__stat--oil { background: var(--orange-soft); color: #a86200; }
.method__stat--warn { background: var(--red-soft); color: #c62f2f; }

/* 破壁打汁提示 */
.warn-box {
  margin-top: 10px;
  padding: 11px 13px;
  border-radius: 13px;
  background: #fff4f4;
  border: 2px solid #ffd2d2;
  color: #8a2b2b;
  font-size: 12.5px;
  font-weight: 700;
  line-height: 1.65;
}
.method__stat--shrink { background: var(--blue-soft); color: var(--blue-dark); }

/* ---------- 结果卡 ---------- */
.result-hero {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 16px;
  border-radius: var(--radius);
  background: linear-gradient(135deg, #f5ffe9, #eaffd6);
  border: 2px solid #d6f0b7;
}
.result-hero__num { font-size: 38px; font-weight: 900; line-height: 1; color: var(--green-dark); }
.result-hero__unit { font-size: 13px; font-weight: 800; color: var(--green-dark); opacity: .8; }
.result-kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kv {
  background: var(--bg-soft);
  border-radius: 12px;
  padding: 9px 11px;
}
.kv__k { font-size: 11.5px; color: var(--muted); font-weight: 800; }
.kv__v { font-size: 15px; font-weight: 900; }
.kv__v small { font-size: 10.5px; font-weight: 800; color: var(--muted); }

/* ---------- 记录列表 ---------- */
.log-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 0;
  border-bottom: 1px dashed #eee;
}
.log-item:last-child { border-bottom: 0; }
.log-item__emoji { font-size: 24px; width: 34px; text-align: center; }
.log-item__main { flex: 1; min-width: 0; }
.log-item__name { font-weight: 900; font-size: 14.5px; }
.log-item__meta { font-size: 11.5px; color: var(--muted); font-weight: 700; }
.log-item__kcal { font-weight: 900; font-size: 14px; white-space: nowrap; }
.log-item__del {
  border: 0; background: none; color: #ccc; font-size: 17px; cursor: pointer;
  padding: 4px 6px; border-radius: 8px;
}
.log-item__del:hover { color: var(--red); background: var(--red-soft); }

/* ---------- 推荐卡 ---------- */
.rec-scroll {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 168px;
  gap: 10px;
  overflow-x: auto;
  padding-bottom: 6px;
  scroll-snap-type: x mandatory;
}
.rec-scroll::-webkit-scrollbar { height: 6px; }
.rec-scroll::-webkit-scrollbar-thumb { background: #e2e2e2; border-radius: 99px; }
.rec {
  scroll-snap-align: start;
  border: 2px solid var(--line);
  border-radius: 15px;
  background: #fff;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  box-shadow: 0 2px 0 var(--line);
  cursor: pointer;
  transition: transform .12s, border-color .12s;
}
.rec:hover { transform: translateY(-2px); border-color: #c9e7a8; }
.rec__emoji { font-size: 26px; }
.rec__name { font-weight: 900; font-size: 14px; }
.rec__why { font-size: 11.5px; color: var(--muted); font-weight: 700; line-height: 1.4; min-height: 32px; }

/* ---------- 宝塔 ---------- */
.pyramid { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.pyr-row { width: 100%; display: flex; align-items: center; gap: 10px; }
.pyr-bar {
  height: 34px;
  border-radius: 9px;
  display: flex;
  align-items: center;
  padding: 0 10px;
  font-size: 12px;
  font-weight: 900;
  color: #fff;
  transition: width .5s ease;
  white-space: nowrap;
  overflow: hidden;
}
.pyr-label { width: 64px; font-size: 12px; font-weight: 900; color: var(--text-soft); text-align: right; }
.pyr-val { font-size: 11px; font-weight: 800; color: var(--muted); white-space: nowrap; }

/* ---------- 弹窗 ---------- */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(20, 20, 20, .55);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
  animation: fadeIn .2s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  width: 100%;
  max-width: 440px;
  max-height: 86vh;
  overflow-y: auto;
  background: #fff;
  border-radius: 24px;
  border: 2px solid var(--line);
  padding: 22px;
  box-shadow: 0 18px 50px rgba(0, 0, 0, .22);
  animation: popIn .26s cubic-bezier(.2, .9, .3, 1.2);
}
@keyframes popIn { from { opacity: 0; transform: scale(.92) translateY(10px); } to { opacity: 1; transform: none; } }
.modal--wide { max-width: 560px; }
.modal__head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
.modal__title { font-size: 19px; font-weight: 900; }
.modal__close { margin-left: auto; border: 0; background: var(--bg-soft); border-radius: 10px; width: 30px; height: 30px; cursor: pointer; color: var(--muted); font-size: 15px; }
.modal__body { font-size: 14px; color: var(--text-soft); }
.modal__foot { display: flex; gap: 10px; margin-top: 18px; }
.modal__foot .btn { flex: 1; }

/* ---------- Toast ---------- */
.toasts {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(var(--nav-h) + 16px);
  z-index: 120;
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
  pointer-events: none;
}
.toast {
  background: #2f2f2f;
  color: #fff;
  padding: 10px 16px;
  border-radius: 12px;
  font-size: 13.5px;
  font-weight: 800;
  box-shadow: 0 8px 22px rgba(0, 0, 0, .25);
  animation: toastIn .22s ease;
  max-width: 88vw;
}
.toast--ok { background: var(--green-dark); }
.toast--err { background: #d83a3a; }
@keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* ---------- 任务 ---------- */
.quest {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 0;
  border-bottom: 1px dashed #eee;
}
.quest:last-child { border-bottom: 0; }
.quest__dot {
  width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--line);
  display: flex; align-items: center; justify-content: center; font-size: 12px; color: #fff;
  flex: none;
}
.quest.is-done .quest__dot { background: var(--green); border-color: var(--green-dark); }
.quest__text { font-size: 13.5px; font-weight: 800; flex: 1; }
.quest.is-done .quest__text { color: var(--muted); text-decoration: line-through; }
.quest__xp { font-size: 11.5px; font-weight: 900; color: var(--blue-dark); }

/* ---------- 日历 ---------- */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.cal__cell {
  aspect-ratio: 1;
  border-radius: 9px;
  background: #f4f4f4;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10.5px;
  font-weight: 800;
  color: #c2c2c2;
}
.cal__cell.is-on { background: var(--green-soft); color: var(--green-dark); }
.cal__cell.is-today { outline: 2px solid var(--blue); outline-offset: 1px; }
.cal__head { font-size: 10.5px; color: var(--muted); font-weight: 900; text-align: center; }

/* ---------- 知识卡 ---------- */
.tip-card {
  border-radius: 16px;
  border: 2px solid #ffe4b8;
  background: linear-gradient(135deg, #fffaf0, #fff5e0);
  padding: 14px;
}
.tip-card__label { font-size: 11.5px; font-weight: 900; color: #b06a00; letter-spacing: .6px; }
.tip-card__title { font-size: 15.5px; font-weight: 900; margin: 4px 0 6px; }
.tip-card__body { font-size: 13px; color: var(--text-soft); line-height: 1.6; }

/* ---------- 首次引导 ---------- */
.onb-dots { display: flex; gap: 6px; margin: 2px 0 16px; }
.onb-dots i { flex: 1; height: 6px; border-radius: 99px; background: #eef0f2; transition: background .25s; }
.onb-dots i.on { background: var(--green); }
.opt-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.opt {
  text-align: left;
  border: 2px solid var(--line);
  border-radius: 14px;
  background: #fff;
  padding: 12px;
  cursor: pointer;
  box-shadow: 0 2px 0 var(--line);
  transition: border-color .15s, background .15s, transform .1s;
  font-family: inherit;
}
.opt:hover { border-color: #c9e7a8; }
.opt:active { transform: translateY(2px); box-shadow: none; }
.opt.is-active { border-color: var(--green); background: var(--green-tint); box-shadow: 0 2px 0 #b6e284; }
.opt__t { font-weight: 900; font-size: 14.5px; color: var(--text); }
.opt__d { font-size: 11.5px; color: var(--muted); font-weight: 700; margin-top: 2px; }
.opt--wide { grid-column: span 2; }

/* ---------- 表格 ---------- */
.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th, .table td { padding: 8px 6px; border-bottom: 1px solid #f0f0f0; text-align: left; }
.table th { font-size: 11.5px; color: var(--muted); font-weight: 900; }
.table td.num, .table th.num { text-align: right; font-variant-numeric: tabular-nums; }

/* ---------- 空状态 ---------- */
.empty { text-align: center; padding: 26px 12px; color: var(--muted); }
.empty__icon { font-size: 40px; margin-bottom: 8px; }
.empty__title { font-weight: 900; color: var(--text-soft); margin-bottom: 4px; }

/* ---------- 折叠 ---------- */
details.panel { border: 2px solid var(--line); border-radius: 14px; background: #fff; padding: 0 14px; }
details.panel > summary { cursor: pointer; padding: 12px 0; font-weight: 900; font-size: 14px; list-style: none; }
details.panel > summary::-webkit-details-marker { display: none; }
details.panel[open] > summary { border-bottom: 1px solid #f0f0f0; margin-bottom: 10px; }

/* ---------- 打印 ---------- */
@media print {
  .tabbar, .topbar, .btn { display: none !important; }
  body { padding: 0; background: #fff; }
}

/* ---- mascot.css ---- */
/* ===== 胡萝卜吉祥物「卜卜」 ===== */
.mascot {
  width: 112px;
  height: 126px;
  display: block;
  overflow: visible;
  filter: drop-shadow(0 6px 10px rgba(255, 150, 0, .18));
}
.mascot--sm { width: 76px; height: 86px; }
.mascot--lg { width: 148px; height: 166px; }

.mascot__body { transform-origin: 80px 96px; animation: mood-breathe 3.6s ease-in-out infinite; }
.mascot__leaf { transform-origin: 80px 52px; }
.mascot__leaf--l { animation: leaf-sway 3.2s ease-in-out infinite; }
.mascot__leaf--r { animation: leaf-sway 3.2s ease-in-out infinite reverse; }
.mascot__arm--l { transform-origin: 46px 92px; animation: arm-wave 3.4s ease-in-out infinite; }
.mascot__arm--r { transform-origin: 114px 92px; animation: arm-wave 3.4s ease-in-out infinite reverse; }

.mascot__lid {
  transform-box: fill-box;
  transform-origin: center;
  transform: scaleY(0);
  animation: blink 5.4s infinite;
}
.mascot__lid--r { animation-delay: .12s; }

.mascot__shadow {
  fill: rgba(60, 60, 60, .10);
  animation: shadow-pulse 3.6s ease-in-out infinite;
}

/* 情绪：开心 */
.mascot.is-happy .mascot__body { animation: mood-bounce .7s ease-in-out infinite; }
.mascot.is-happy .mascot__arm--l { animation: arm-up .7s ease-in-out infinite; }
.mascot.is-happy .mascot__arm--r { animation: arm-up .7s ease-in-out infinite reverse; }

/* 情绪：庆祝 */
.mascot.is-celebrate { animation: mascot-jump 1.1s cubic-bezier(.3, .9, .4, 1.4) 2; }
.mascot.is-celebrate .mascot__leaf--l { animation: leaf-spin .9s ease-in-out 2; }
.mascot.is-celebrate .mascot__leaf--r { animation: leaf-spin .9s ease-in-out 2 reverse; }
.mascot.is-celebrate .mascot__arm--l { animation: arm-up .5s ease-in-out infinite; }
.mascot.is-celebrate .mascot__arm--r { animation: arm-up .5s ease-in-out infinite reverse; }

/* 情绪：困倦 */
.mascot.is-sleepy .mascot__body { animation: mood-sleep 4s ease-in-out infinite; }
.mascot.is-sleepy .mascot__lid { animation: none; transform: scaleY(1); }
.mascot.is-sleepy .mascot__lid--r { animation: none; transform: scaleY(1); }

/* 情绪：难过 */
.mascot.is-sad .mascot__body { animation: mood-sad 3s ease-in-out infinite; }

@keyframes mood-breathe {
  0%, 100% { transform: scale(1, 1); }
  50% { transform: scale(1.02, .985); }
}
@keyframes mood-bounce {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-7px) scale(1.02, .98); }
}
@keyframes mood-sleep {
  0%, 100% { transform: rotate(-2deg) scale(.99); }
  50% { transform: rotate(2deg) scale(1.01); }
}
@keyframes mood-sad {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(2px) scale(.99); }
}
@keyframes leaf-sway {
  0%, 100% { transform: rotate(-4deg); }
  50% { transform: rotate(5deg); }
}
@keyframes leaf-spin {
  0%, 100% { transform: rotate(-8deg); }
  50% { transform: rotate(14deg) scale(1.05); }
}
@keyframes arm-wave {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(-9deg); }
}
@keyframes arm-up {
  0%, 100% { transform: rotate(-6deg) translateY(0); }
  50% { transform: rotate(24deg) translateY(-3px); }
}
@keyframes blink {
  0%, 90%, 100% { transform: scaleY(0); }
  92.5%, 95.5% { transform: scaleY(1); }
}
@keyframes shadow-pulse {
  0%, 100% { transform: scale(1); opacity: .9; }
  50% { transform: scale(.94); opacity: .7; }
}
@keyframes mascot-jump {
  0% { transform: translateY(0) scale(1); }
  30% { transform: translateY(-26px) scale(1.04, .96); }
  55% { transform: translateY(0) scale(.97, 1.03); }
  75% { transform: translateY(-10px) scale(1.02, .98); }
  100% { transform: translateY(0) scale(1); }
}

/* 对话气泡 */
.mascot-wrap { position: relative; display: inline-flex; align-items: flex-end; gap: 6px; }
.bubble {
  position: relative;
  background: #fff;
  border: 2px solid var(--line);
  border-radius: 14px;
  padding: 9px 13px;
  font-size: 13px;
  font-weight: 800;
  color: var(--text-soft);
  max-width: 230px;
  box-shadow: 0 3px 0 var(--line);
  animation: bubbleIn .3s ease;
}
.bubble::after {
  content: "";
  position: absolute;
  left: -8px;
  bottom: 12px;
  width: 12px;
  height: 12px;
  background: #fff;
  border-left: 2px solid var(--line);
  border-bottom: 2px solid var(--line);
  transform: rotate(45deg);
}
@keyframes bubbleIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* 彩纸 */
.confetti {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 130;
  overflow: hidden;
}
.confetti i {
  position: absolute;
  top: -12px;
  width: 8px;
  height: 13px;
  border-radius: 2px;
  opacity: .95;
  animation: confetti-fall linear forwards;
}
@keyframes confetti-fall {
  0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
  100% { transform: translateY(105vh) rotate(720deg); opacity: .9; }
}

</style>

/* 参考《中国居民膳食营养素参考摄入量（2023）》成人 18–49 岁，
   另给 14–17 与 50+ 两档做近似调整；孕期/哺乳期/疾病状态不在此表内。 */
Nutri.driFor = function (profile) {
  var p = Object.assign({}, Nutri.DEFAULT_PROFILE, profile || {});
  var male = p.sex === "m";
  var age = +p.age || 25;
  var teen = age < 18;
  var senior = age >= 50;
  return {
    va: male ? 800 : 700,

    b1: male ? 1.4 : 1.2,
    b2: male ? 1.4 : 1.2,
    b6: 1.4, b12: 2.4, folate: 400,
    niacin: male ? 15 : 12,

    iron: male ? (teen ? 15 : 12) : (senior ? 12 : 18),
    zinc: male ? (teen ? 15 : 12.5) : (teen ? 11.5 : 7.5),
    magnesium: male && age >= 31 ? 350 : 330,
    potassium: 2000, sodium: 2000, selenium: 60, iodine: 120,
    phosphorus: 700, choline: male ? 500 : 400

};

  var p = Object.assign({}, Nutri.DEFAULT_PROFILE, profile || {});
  var m = (+p.height || 160) / 100;
  return (+p.weight || 60) / (m * m);
};

  if (!isFinite(bmi) || bmi <= 0) return { label: "—", cls: "" };
  if (bmi < 18.5) return { label: "偏瘦", cls: "chip--blue" };
  if (bmi < 24) return { label: "正常", cls: "chip--green" };
  if (bmi < 28) return { label: "超重", cls: "chip--orange" };
  return { label: "肥胖", cls: "chip--red" };
};

Nutri.GOAL_LABEL = { fatloss: "减脂", maintain: "保持", gain: "增肌" };

Nutri.computeTargets = function (profile) {
  var p = Object.assign({}, Nutri.DEFAULT_PROFILE, profile || {});
  var w = +p.weight || 60, h = +p.height || 160, age = +p.age || 19;
  var male = p.sex === "m";
  var s = male ? 5 : -161;
  var bmr = 10 * w + 6.25 * h - 5 * age + s;
  var tdee = bmr * (+p.activity || 1.375);

  var goal = p.goal === "maintain" || p.goal === "gain" ? p.goal : "fatloss";
  var deficit = goal === "fatloss" ? (+p.deficit || 0) : 0;
  var surplus = goal === "gain" ? (+p.surplus || 300) : 0;
  var floor = male ? 1500 : 1200;
  var kcal = Math.round(Math.max(floor, tdee - deficit + surplus));

  var perKg = goal === "gain" ? 1.6 : (goal === "maintain" ? 1.0 : 1.25);
  var protein = Math.max(Math.round(perKg * w), male ? 65 : 55);

    bmr: Math.round(bmr), tdee: Math.round(tdee), kcal: kcal,
    goal: goal, deficit: deficit, surplus: surplus, floor: floor,
    protein: protein, fat: fat, carb: carb,
    fiber: 25, sugar: 25

};

/* ---- engine.js ---- */
/* ===== 营养计算引擎（纯函数，不碰 DOM） ===== */
window.Nutri = window.Nutri || {};

Nutri.engine = (function () {
  var NUTS = Nutri.NUTRIENTS;
  var OIL_KCAL_PER_G = 8.99;
  var OIL_VE_PER_G = 0.6;
  var NA_PER_G_SALT = 400;

  function norm(food) {
    if (!food) return null;
    if (!food.per100) food.per100 = {};
    for (var i = 0; i < NUTS.length; i++) {
      var k = NUTS[i].k;
      if (food.per100[k] === undefined) food.per100[k] = null;
    }
    return food;
  }

  function catOf(food) { return (food && food.cat) || "other"; }

  function yieldOf(method, food) {
    if (!method) return 1;
    var cat = catOf(food);
    var y = method.y[cat];
    if (y === undefined) y = method.y["default"];
    if (y === undefined) y = 1;
    if (cat === "grain" && y > 1 && Nutri.PREPARED_RE.test(food.name || "")) y = 1;
    return y;
  }

  function oilOf(method, food) {
    if (!method) return 0;
    var cat = catOf(food);
    var v = method.oil[cat];
    if (v === undefined) v = method.oil["default"];
    return v || 0;
  }

  function retainOf(method, key) {
    if (!method) return 1;
    if (method.retain && method.retain[key] !== undefined) return method.retain[key];
    if (method.leach && method.leach[key] !== undefined) return method.leach[key];
    return 1;
  }

  /* 生重 -> 熟重 / 用油量（用于记录页实时提示） */
  function preview(food, grams, methodId) {
    var m = Nutri.METHOD_MAP[methodId] || Nutri.METHOD_MAP.raw;
    var g = Math.max(0, +grams || 0);
    var y = yieldOf(m, food);
    return {
      yield: y,
      shrinkPct: Math.round((1 - y) * 100),
      gainPct: y > 1 ? Math.round((y - 1) * 100) : 0,
      cookedGrams: Math.round(g * y * 10) / 10,
      oilPer100: oilOf(m, food),
      oil: Math.round(oilOf(m, food) * g / 100 * 10) / 10
    };
  }

  /* 核心：食材 × 克数 × 烹饪方式 -> 营养结果 */
  function compute(food, grams, methodId, opts) {
    opts = opts || {};
    var m = Nutri.METHOD_MAP[methodId] || Nutri.METHOD_MAP.raw;
    var g = Math.max(0, Math.min(5000, +grams || 0));
    var base = g / 100;
    var y = yieldOf(m, food);
    var oil = opts.oil !== undefined && opts.oil !== null && opts.oil !== ""
      ? Math.max(0, +opts.oil) : Math.round(oilOf(m, food) * base * 10) / 10;
    var sugarG = opts.sugarApplied === false ? 0
      : (m.sugar ? Math.round(m.sugar * base * 10) / 10 : 0);
    if (opts.sugar !== undefined && opts.sugar !== null && opts.sugar !== "") {
      sugarG = Math.max(0, +opts.sugar);
    }
    var saltG = opts.saltApplied === false ? 0 : (m.salt ? Math.round(m.salt * base * 10) / 10 : 0);
    if (opts.salt !== undefined && opts.salt !== null && opts.salt !== "") {
      saltG = Math.max(0, +opts.salt);
    }

    var n = {};
    for (var i = 0; i < NUTS.length; i++) {
      var k = NUTS[i].k;
      var v = food.per100[k];
      if (v === null || v === undefined) { n[k] = null; continue; }
      n[k] = v * base * retainOf(m, k);
    }
    n.kcal = (food.per100.kcal || 0) * base;
    if (n.fat !== null) n.fat = (n.fat || 0) + oil;
    else if (oil > 0) n.fat = oil;
    if (n.ve !== null || oil > 0) n.ve = (n.ve || 0) + oil * OIL_VE_PER_G;
    if (oil > 0) n.kcal += oil * OIL_KCAL_PER_G;
    if (sugarG > 0) {
      n.kcal += sugarG * 4;
      n.carb = (n.carb || 0) + sugarG;
      n.sugar = (n.sugar || 0) + sugarG;
    }
    if (saltG > 0) n.sodium = (n.sodium || 0) + saltG * NA_PER_G_SALT;

    return {
      food: food, grams: g, method: m.id, methodName: m.name,
      cookedGrams: Math.round(g * y * 10) / 10,
      yield: y, shrinkPct: Math.round((1 - y) * 100),
      oil: oil, sugar: sugarG, salt: saltG,
      n: n, kcal: Math.round(n.kcal)
    };
  }

  function sumItems(items) {
    var total = {};
    for (var i = 0; i < NUTS.length; i++) total[NUTS[i].k] = null;
    total.kcal = 0;
    (items || []).forEach(function (it) {
      var n = it && it.n ? it.n : null;
      if (!n) return;
      for (var i = 0; i < NUTS.length; i++) {
        var k = NUTS[i].k;
        if (n[k] === null || n[k] === undefined) continue;
        total[k] = (total[k] === null ? 0 : total[k]) + n[k];
      }
    });
    total.kcal = Math.round(total.kcal);
    return total;
  }

  function pctOf(value, target) {
    if (value === null || value === undefined || !target) return null;
    return (value / target) * 100;
  }

  function statusOf(value, target, maxFlag) {
    if (value === null || value === undefined) return "unknown";
    var p = pctOf(value, target);
    if (maxFlag) {
      if (p > 100) return "high";
      if (p > 85) return "near";
      return "ok";
    }
    if (p >= 90) return "ok";
    if (p >= 70) return "near";
    return "low";
  }

  function fmt(v, dec) {
    if (v === null || v === undefined || isNaN(v)) return "—";
    var d = dec === undefined ? 1 : dec;
    var x = Math.round(v * Math.pow(10, d)) / Math.pow(10, d);
    return String(x);
  }

  function search(query, extraFoods, limit) {
    var all = (Nutri.library && Nutri.library.foods()) || Nutri.foods;
    var q = String(query || "").trim();
    if (!q) {
      return all.filter(function (f) { return f.common; }).slice(0, 12);
    }
    var lower = q.toLowerCase();
    var scored = [];
    for (var i = 0; i < all.length; i++) {
      var f = all[i];
      var name = f.name || "";
      var score = 0;
      if (name === q) score = 120;
      else if (name.indexOf(q) === 0) score = 100;
      else if (name.indexOf(q) > -1) score = 80;
      else if (f.alias) {
        for (var j = 0; j < f.alias.length; j++) {
          if (f.alias[j].indexOf(q) > -1) { score = Math.max(score, 72); break; }
        }
      }
      if (!score && lower.length > 1) {
        var p = (f.py || "");
        if (p && p.indexOf(lower) === 0) score = 60;
      }
      if (!score && f.en && f.en.toLowerCase().indexOf(lower) > -1) score = 55;
      if (!score) continue;
      if (f.common) score += 6;
      if (f.custom) score += 12;
      score -= Math.min(10, Math.max(0, name.length - 4));
      scored.push({ f: f, s: score });
    }
    scored.sort(function (a, b) { return b.s - a.s; });
    return scored.slice(0, limit || 30).map(function (x) { return x.f; });
  }

  function layerOf(food) {
    if (food.layer) return food.layer;
    var map = {
      grain: "谷薯", legume: "奶豆", leafy: "蔬菜", rootVeg: "蔬菜", fruitVeg: "蔬菜",
      mushroom: "蔬菜", fruit: "水果", meat: "肉蛋鱼", poultry: "肉蛋鱼",
      egg: "肉蛋鱼", fish: "肉蛋鱼", dairy: "奶豆", nut: "坚果", oil: "油脂"
    };
    return map[food.cat] || "其他";
  }

  return {
    norm: norm, catOf: catOf, yieldOf: yieldOf, oilOf: oilOf, retainOf: retainOf,
    preview: preview, compute: compute, sumItems: sumItems,
    pctOf: pctOf, statusOf: statusOf, fmt: fmt, search: search, layerOf: layerOf
  };
})();

/* ---- library.js ---- */
/* ===== 食材库管理：内置库 + 自定义层（仅内存，刷新还原） ===== */
window.Nutri = window.Nutri || {};

Nutri.library = (function () {
  var custom = [];          /* 追加模式收集的食材 */
  var replaced = null;      /* 全量替换后的食材库 */
  var index = {};

  function rebuildIndex() {
    index = {};
    Nutri.foods.forEach(function (f) { index[f.id] = f; });
    custom.forEach(function (f) { index[f.id] = f; });
    (replaced || []).forEach(function (f) { index[f.id] = f; });
  }

  function foods() {
    if (replaced) return replaced;
    return custom.concat(Nutri.foods);
  }

  function byId(id) {
    if (index[id]) return index[id];
    return Nutri.foodIndex[id] || null;
  }

  var VALID_CATS = Object.keys(Nutri.CAT_LABEL);

  function validate(data) {
    var errors = [];
    if (!Array.isArray(data)) {
      return { ok: false, errors: ["文件内容必须是一个数组（JSON Array），当前是 " + (data === null ? "null" : typeof data) + "。"] };
    }
    if (!data.length) return { ok: false, errors: ["数组是空的，没有可导入的食材。"] };
    if (data.length > 5000) return { ok: false, errors: ["一次最多导入 5000 条，当前 " + data.length + " 条。"] };
    data.forEach(function (it, i) {
      var at = "第 " + (i + 1) + " 条：";
      if (!it || typeof it !== "object" || Array.isArray(it)) {
        errors.push(at + "不是对象。"); return;
      }
      if (typeof it.name !== "string" || !it.name.trim()) {
        errors.push(at + "缺少 name（食材名称，非空字符串）。");
      }
      if (it.per100 === undefined || typeof it.per100 !== "object" || Array.isArray(it.per100)) {
        errors.push(at + "缺少 per100 对象（每 100 g 营养数据）。");
        return;
      }
      var kcal = it.per100.kcal;
      if (typeof kcal !== "number" || isNaN(kcal) || kcal < 0 || kcal > 950) {
        errors.push(at + "per100.kcal 必须是 0–950 之间的数字。");
      }
      ["protein", "fat", "carb", "fiber", "sugar", "sodium", "calcium", "iron", "vc",
        "va", "b12", "folate"].forEach(function (k) {
        var v = it.per100[k];
        if (v !== undefined && v !== null && (typeof v !== "number" || isNaN(v) || v < 0)) {
          errors.push(at + "per100." + k + " 必须是非负数字或 null。");
        }
      });
      if (it.cat !== undefined && it.cat !== null && VALID_CATS.indexOf(it.cat) < 0) {
        errors.push(at + "cat 必须是 " + VALID_CATS.slice(0, 8).join("/") + " 等类别之一（当前：" + it.cat + "）。");
      }
    });
    if (errors.length > 30) errors = errors.slice(0, 30).concat(["……还有 " + (errors.length - 30) + " 条错误未显示"]);
    return { ok: errors.length === 0, errors: errors };
  }

  function normalize(it, seq) {
    var per100 = {};
    Object.keys(it.per100 || {}).forEach(function (k) {
      var v = it.per100[k];
      per100[k] = (v === null || v === undefined) ? null : +v;
    });
    if (per100.kcal === undefined) per100.kcal = null;
    return {
      id: it.id && String(it.id) ? String(it.id) : "custom_" + Date.now().toString(36) + "_" + seq,
      name: String(it.name).trim(),
      alias: Array.isArray(it.alias) ? it.alias.slice(0, 6) : undefined,
      cat: VALID_CATS.indexOf(it.cat) >= 0 ? it.cat : "other",
      layer: it.layer,
      common: !!it.common,
      custom: true,
      src: "自定义",
      special: Array.isArray(it.special) ? it.special : undefined,
      per100: per100
    };
  }

  function append(data) {
    var v = validate(data);
    if (!v.ok) return { ok: false, errors: v.errors };
    var existing = {};
    foods().forEach(function (f) { existing[f.name] = true; });
    var added = 0, skipped = 0;
    data.forEach(function (it, i) {
      var name = String(it.name).trim();
      if (existing[name]) { skipped++; return; }
      existing[name] = true;
      custom.push(normalize(it, i));
      added++;
    });
    rebuildIndex();
    return { ok: true, added: added, skipped: skipped };
  }

  function replaceAll(data) {
    var v = validate(data);
    if (!v.ok) return { ok: false, errors: v.errors };
    replaced = data.map(function (it, i) { return normalize(it, i); });
    rebuildIndex();
    return { ok: true, added: replaced.length, skipped: 0 };
  }

  function reset() {
    custom = [];
    replaced = null;
    rebuildIndex();
  }

  function isTemp() { return custom.length > 0 || !!replaced; }

  function stats() {
    return {
      builtin: Nutri.foods.length,
      custom: custom.length,
      replaced: replaced ? replaced.length : 0,
      total: foods().length,
      temp: isTemp()
    };
  }

  function exportJson() {
    var list = foods().map(function (f) {
      var o = { id: f.id, name: f.name, cat: f.cat, per100: f.per100 };
      if (f.alias) o.alias = f.alias;
      if (f.layer) o.layer = f.layer;
      if (f.common) o.common = true;
      if (f.special) o.special = f.special;
      if (f.src) o.src = f.src;
      return o;
    });
    return JSON.stringify(list, null, 1);
  }

  rebuildIndex();

  return {
    foods: foods, byId: byId, validate: validate, append: append,
    replaceAll: replaceAll, reset: reset, isTemp: isTemp, stats: stats,
    exportJson: exportJson
  };
})();

/* ---- store.js ---- */
/* ===== 本地状态：打卡记录只存在本机，与食材库互不影响 ===== */
window.Nutri = window.Nutri || {};

Nutri.store = (function () {
  var KEY = "nutri.state.v1";
  var state = null;
  var storageOk = true;

  function blank() {
    return {
      version: 1,
      onboarded: false,
      profile: Object.assign({}, Nutri.DEFAULT_PROFILE),
      days: {},
      streak: { count: 0, best: 0, lastDate: null },
      xp: 0,
      favorites: [],
      tipSeen: [],
      settings: { oilType: "rapeseed", usdaKey: "", usdaEnabled: false, showRaw: true }
    };
  }

  function read() {
    try {
      var raw = window.localStorage.getItem(KEY);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (e) {
      storageOk = false;
      return null;
    }
  }

  function migrate(s) {
    var b = blank();
    if (!s || typeof s !== "object") return b;
    var out = Object.assign({}, b, s);
    out.profile = Object.assign({}, b.profile, s.profile || {});
    out.settings = Object.assign({}, b.settings, s.settings || {});
    out.streak = Object.assign({}, b.streak, s.streak || {});
    if (!out.days || typeof out.days !== "object") out.days = {};
    if (!Array.isArray(out.favorites)) out.favorites = [];
    if (!Array.isArray(out.tipSeen)) out.tipSeen = [];
    if (typeof out.xp !== "number" || isNaN(out.xp)) out.xp = 0;
    /* 老版本没有 onboarded 字段：已有数据的老用户直接视为已完成引导 */
    out.onboarded = s.onboarded === undefined ? true : !!s.onboarded;
    return out;
  }

  function isFirstRun() {
    return read() === null;
  }

  function finishOnboarding(p) {
    var s = load();
    s.profile = Object.assign({}, s.profile, p || {});
    s.onboarded = true;
    save();
    return s.profile;
  }

  function exportState() {
    var s = load();
    var copy = JSON.parse(JSON.stringify(s));
    if (copy.settings) delete copy.settings.usdaKey;
    return JSON.stringify(copy, null, 1);
  }

  function importState(text) {
    var obj;
    try { obj = JSON.parse(text); } catch (e) { return { ok: false, error: "JSON 解析失败：" + e.message }; }
    if (!obj || typeof obj !== "object") return { ok: false, error: "文件内容不是对象。" };
    if (!obj.days || typeof obj.days !== "object") return { ok: false, error: "缺少 days 字段，可能不是本应用的备份。" };
    if (!obj.profile || typeof obj.profile !== "object") return { ok: false, error: "缺少 profile 字段。" };
    state = migrate(obj);
    state.onboarded = true;
    save();
    return { ok: true, days: Object.keys(state.days).length };
  }

  function load() {
    if (state) return state;
    state = migrate(read());
    return state;
  }

  function save() {
    if (!state) return;
    try {
      window.localStorage.setItem(KEY, JSON.stringify(state));
    } catch (e) {
      storageOk = false;
    }
  }

  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  function dateKey(d) {
    d = d || new Date();
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }

  function offsetKey(days) {
    var d = new Date();
    d.setHours(12, 0, 0, 0);
    d.setDate(d.getDate() + days);
    return dateKey(d);
  }

  function today() { return dateKey(); }

  function day(key) {
    var s = load();
    var k = key || today();
    if (!s.days[k]) {
      s.days[k] = { items: [], checkedIn: false, tipId: null, xp: 0, quests: {} };
    }
    if (!Array.isArray(s.days[k].items)) s.days[k].items = [];
    if (!s.days[k].quests) s.days[k].quests = {};
    return s.days[k];
  }

  function dayStats(key) {
    var d = day(key);
    var t = Nutri.engine.sumItems(d.items);
    var veg = 0, fruit = 0;
    d.items.forEach(function (it) {
      if (!it || !it.grams) return;
      if (["leafy", "rootVeg", "fruitVeg", "mushroom"].indexOf(it.cat) >= 0) veg += it.grams;
      if (it.cat === "fruit") fruit += it.grams;
    });
    t.vegGrams = Math.round(veg * 10) / 10;
    t.fruitGrams = Math.round(fruit * 10) / 10;
    t.vegFruitGrams = Math.round((veg + fruit) * 10) / 10;
    t.itemCount = d.items.length;
    return t;
  }

  function totals(key) { return dayStats(key); }

  function addXp(n) {
    var s = load();
    s.xp = Math.max(0, (s.xp || 0) + n);
    return s.xp;
  }

  function levelOf(xp) { return 1 + Math.floor(Math.sqrt(Math.max(0, xp) / 120)); }
  function levelProgress(xp) {
    var lv = levelOf(xp);
    var cur = Math.pow(lv - 1, 2) * 120;
    var next = Math.pow(lv, 2) * 120;
    return { level: lv, cur: xp - cur, need: next - cur, pct: (xp - cur) / (next - cur) * 100 };
  }

  function addItem(result) {
    var s = load();
    var d = day();
    var item = {
      uid: "i" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      foodId: result.food.id,
      name: result.food.name,
      cat: result.food.cat,
      grams: result.grams,
      method: result.method,
      methodName: result.methodName,
      oil: result.oil,
      sugar: result.sugar,
      salt: result.salt,
      cookedGrams: result.cookedGrams,
      n: result.n,
      kcal: result.kcal,
      ts: Date.now()
    };
    d.items.push(item);
    addXp(10);
    refreshQuests();
    save();
    return item;

      /* 在评分最高的几项里轮换，保证每天不重样 */
      var top = pool.slice(0, Math.max(6, slot.n * 3));
      var rot = Math.floor(rand() * Math.max(1, top.length));
      top = top.slice(rot).concat(top.slice(0, rot));
      var picked = 0;
      for (var i = 0; i < top.length && picked < slot.n; i++) {
        var f = top[i];
        var bn = baseName(f.name);
        if (usedBase[bn]) continue;
        used[f.id] = true;
        usedBase[bn] = true;
        picked++;
        var lo = slot.grams[0], hi = slot.grams[1];
        var k100 = f.per100.kcal || 0;
        if (slot.layer !== "谷薯" && slot.layer !== "坚果") {
          if (k100 > 300) hi = Math.min(hi, 30);
          else if (k100 > 200) hi = Math.min(hi, 60);
        }
        var g = Math.round((Math.min(lo, hi) + rand() * (hi - Math.min(lo, hi))) / 10) * 10;
        if (g < 10) g = 10;
        chosen.push({
          food: f, grams: g, layer: slot.layer,
          reason: reasonFor(f, slot),
          kcal: Math.round((f.per100.kcal || 0) * g / 100)
        });
      }
    });
    return chosen;
  }

  function reasonFor(f, slot) {
    var p = f.per100;
    if ((p.protein || 0) >= 15) return "高蛋白 " + Math.round(p.protein) + " g/100 g";
    if ((p.fiber || 0) >= 4) return "膳食纤维 " + E.fmt(p.fiber, 1) + " g/100 g";
    if ((p.vc || 0) >= 40) return "维生素 C " + Math.round(p.vc) + " mg/100 g";
    if ((p.calcium || 0) >= 100) return "钙 " + Math.round(p.calcium) + " mg/100 g";
    if ((p.carotene || 0) >= 1000) return "富含 β-胡萝卜素";
    if (slot.layer === "谷薯") return "主食提供能量与 B 族维生素";
    return slot.why;
  }

  return {
    advice: advice, topFoods: topFoods, dailyTen: dailyTen,
    pyramidProgress: pyramidProgress, density: density
  };
})();

/* ===== USDA FoodData Central 联网补全（可选，需要 api.data.gov KEY） ===== */
window.Nutri = window.Nutri || {};

Nutri.usda = (function () {
  var BASE = "https://api.nal.usda.gov/fdc/v1/foods/search";
  var cache = {};

  var NUM = {
    "208": "kcal", "203": "protein", "204": "fat", "205": "carb", "291": "fiber",
    "269": "sugar", "301": "calcium", "303": "iron", "304": "magnesium",
    "305": "phosphorus", "306": "potassium", "307": "sodium", "309": "zinc",
    "312": "copper", "315": "manganese", "317": "selenium", "320": "va",
    "401": "vc", "323": "ve", "328": "vd", "430": "vk", "404": "b1",
    "405": "b2", "406": "niacin", "415": "b6", "418": "b12", "435": "folate",
    "421": "choline", "314": "iodine"
  };

  function pick(foodNutrients) {
    var out = {};
    (foodNutrients || []).forEach(function (fn) {
      var raw = fn.nutrientNumber || "";
      var num = String(raw).replace(/^0+/, "");
      var key = NUM[num] || NUM[String(fn.nutrientNumber)];
      if (!key && fn.nutrientName) {
        var n = String(fn.nutrientName).toLowerCase();
        if (n.indexOf("energy") === 0 && /kcal/.test(fn.unitName || "")) key = "kcal";
        else if (n === "protein") key = "protein";
        else if (n.indexOf("total lipid") === 0) key = "fat";
        else if (n.indexOf("carbohydrate, by difference") === 0) key = "carb";
        else if (n.indexOf("fiber, total dietary") === 0) key = "fiber";
        else if (n.indexOf("sugars, total") === 0) key = "sugar";
      }
      if (!key) return;
      var v = fn.value;
      if (typeof v !== "number" || isNaN(v)) return;
      if (key === "kcal" && /kj/i.test(fn.unitName || "")) v = v / 4.184;
      out[key] = Math.round(v * 1000) / 1000;
    });
    return out;
  }

  function map(food, idx) {
    var p = pick(food.foodNutrients);
    var name = food.description || food.lowercaseDescription || ("USDA food " + idx);
    name = name.replace(/,?\s*(raw|uncooked|cooked|frozen|fresh)\b/gi, "").replace(/\s+/g, " ").trim();
    if (!name) name = "USDA " + (food.fdcId || idx);
    return {
      id: "usda_" + (food.fdcId || idx),
      name: name,
      cat: "other",
      common: false,
      custom: true,
      src: "USDA",
      per100: p
    };
  }

  function search(query, key, pageSize) {
    var q = String(query || "").trim();
    if (!q) return Promise.resolve([]);
    var ck = q + "|" + (pageSize || 12);
    if (cache[ck]) return Promise.resolve(cache[ck]);
    var url = BASE + "?api_key=" + encodeURIComponent(key) +
      "&query=" + encodeURIComponent(q) +
      "&pageSize=" + (pageSize || 12) +
      "&dataType=" + encodeURIComponent("Foundation,SR Legacy");
    return fetch(url, { headers: { Accept: "application/json" } })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status + (r.status === 403 ? "（KEY 无效或超限）" : ""));
        return r.json();
      })
      .then(function (data) {
        var list = (data.foods || []).map(map).filter(function (f) {
          return f.per100 && typeof f.per100.kcal === "number";
        });
        cache[ck] = list;
        return list;
      });
  }

  return { search: search };
})();
